[workspace]
resolver = "3"
members = ["crates/search-engine", "crates/vector-db", "crates/hybrid"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
memmap2 = "0.9.11"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "charset", "http2", "system-proxy"] }
scraper = "0.27.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }

search-engine = { path = "crates/search-engine" }
vector-db = { path = "crates/vector-db" }

[profile.release]
debug = "line-tables-only"
